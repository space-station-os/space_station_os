gnc_plant:
  ros__parameters:
    subsystem_name: "gnc_plant"
    step_rate_hz: 50.0
    max_substep_s: 0.02
    sensor_seed: 12345

    inertia:
      ixx: 100000000.0
      iyy: 80000000.0
      izz: 60000000.0
      ixy: 0.0
      ixz: 0.0
      iyz: 0.0

    disturbance:
      enable_gravity_gradient: true
      enable_aero_drag: true
      enable_srp: true
      drag_coefficient: 2.2
      frontal_area_m2: 1500.0
      cop_offset_m: 2.0
      srp_area_m2: 2500.0
      srp_reflectivity: 1.3
      srp_center_offset_m: 1.5
