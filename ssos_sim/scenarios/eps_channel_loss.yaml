scenario:
  name: eps_channel_loss
  duration_s: 300
  sim_rate_hz: 10
  time_scale: 10.0

  faults:
    # One feeder from channel 0 to MBSU 0 opens: the MBSU reroutes onto
    # channels 1 and 2 and keeps its loads, and EPS reports the open feeder
    # (DEGRADED) until it closes again.
    - name: channel_0_feeder_open
      type: mbsu_channel_loss
      target_subsystem: eps
      trigger:
        type: time
        at_s: 30.0
      params:
        channel: 0
      duration_s: 120

  expected_outcomes:
    - state_transition:
        from: NOMINAL
        to: DEGRADED
        before_s: 35.0
    - state_transition:
        from: DEGRADED
        to: NOMINAL
        via: RECOVERY
        before_s: 300.0
