scenario:
  # The cabin O2 sensor sticks at 23% for 2 h. The cabin analyser flags the
  # disagreement (DEGRADED), the OGS throttles back on the false reading, and
  # everything recovers once the sensor is restored.
  name: eclss_o2_sensor_fault
  duration_s: 14400
  sim_rate_hz: 20
  time_scale: 60.0

  faults:
    - name: o2_sensor_stuck_high
      type: o2_sensor_stuck
      target_subsystem: cabin
      target_interface: /ssos/cabin/atmosphere
      trigger:
        type: time
        at_s: 600.0
      params:
        value_pct: 23.0
      duration_s: 7200

  expected_outcomes:
    - state_transition:
        from: NOMINAL
        to: DEGRADED
        before_s: 660.0
    - state_transition:
        from: DEGRADED
        to: NOMINAL
        via: RECOVERY
        before_s: 8100.0
