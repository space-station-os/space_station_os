name: Close issues on dev merge

on:
  push:
    branches:
      - 'v*-dev'

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-linked-issues:
    name: Close issues referenced by merged PR
    runs-on: ubuntu-latest

    steps:
      - name: Find merged PR and close referenced issues
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const baseBranch = context.ref.replace('refs/heads/', '');

            const commitShas = [
              context.sha,
              ...(context.payload.commits ?? []).map(commit => commit.id),
            ];

            const pullRequests = new Map();

            for (const sha of [...new Set(commitShas)]) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: sha,
                });

              for (const pr of prs) {
                if (pr.merged_at && pr.base.ref === baseBranch) {
                  pullRequests.set(pr.number, pr);
                }
              }
            }

            if (pullRequests.size === 0) {
              core.info('No merged pull request is associated with this push.');
              return;
            }

            const closingPattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;

            for (const prSummary of pullRequests.values()) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prSummary.number,
              });

              const issueNumbers = new Set();

              for (const match of (pr.body ?? '').matchAll(closingPattern)) {
                issueNumbers.add(Number(match[1]));
              }

              if (issueNumbers.size === 0) {
                core.info(
                  `PR #${pr.number} contains no supported closing keywords.`
                );
                continue;
              }

              for (const issueNumber of issueNumbers) {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });

                if (issue.pull_request) {
                  core.info(
                    `#${issueNumber} is a pull request, not an issue. Skipping.`
                  );
                  continue;
                }

                if (issue.state === 'closed') {
                  core.info(`Issue #${issueNumber} is already closed.`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body:
                    `Implemented by #${pr.number} and merged into ` +
                    `\`${baseBranch}\`.`,
                });

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed',
                });

                core.info(
                  `Closed issue #${issueNumber} from merged PR #${pr.number}.`
                );
              }
            }
