# EPS node-level and topology parameters for ssos_eps/eps_node.
eps_node:
  ros__parameters:
    use_sim_time: true
    step_rate_hz: 1.0

    enable_auto_faults: true

    # Physics fault hooks for what-if testing (-1 = none).
    faults.failed_oru: -1
    faults.faulted_bcdu: -1
    faults.faulted_ddcu: -1
    faults.faulted_mbsu: -1
    faults.offline_channel: -1

    # Topology (static: reconfigure to apply). Each channel feeds one MBSU;
    # each DDCU hangs off one MBSU, so eps.ddcu_mbsu also sets the DDCU count.
    eps.n_channels: 12
    eps.orus_per_channel: 2
    eps.n_mbsu: 4
    eps.channel_mbsu: [0, 0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3]
    eps.ddcu_mbsu: [0, 0, 1, 1, 2, 2, 3, 3]

    # Thermal coupling: EPS losses heat thermal.coldplate_node and the power
    # delivered to loads heats thermal.cabin_node (/thermal/heat_loads); the
    # cold plate's temperature from /thermal/nodes/state replaces the DDCU and
    # battery cold-plate parameters while ssos_thermal is running.
    thermal.enable_coupling: true
    thermal.coldplate_node: "itcs_coldplate"
    thermal.cabin_node: "base_link"

    eps.low_soc_threshold: 0.20
    # Battery state of health below this reports EPS degraded.
    eps.min_state_of_health: 0.80
